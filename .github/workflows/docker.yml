name: Docker image

# Builds the mbregistry container image (Dockerfile: sprint 009 ticket
# 001) for linux/amd64 and linux/arm64, and -- for a pushed v* tag --
# publishes it to GHCR as ghcr.io/league-microbit/mbtools:<version> and
# :latest. workflow_dispatch and a PR touching the Dockerfile/this
# workflow build both architectures without pushing, as a
# build-correctness check.
#
# Build strategy: one native runner per architecture (ubuntu-24.04 for
# amd64, ubuntu-24.04-arm for arm64 -- the same matrix release-deb.yml
# already uses), each building only its own platform. No QEMU: a
# runner's own architecture always matches the single platform it
# builds, so docker/setup-buildx-action's default docker-container
# driver never needs to cross-emulate. This is faster and less flaky
# than a single QEMU-emulated multi-platform build, matching
# release-deb.yml's existing native-arm-runner rationale. The two
# per-arch images are combined into one multi-arch manifest list only
# when actually publishing (the `push` job below), via the documented
# "build once per runner, push by digest, merge with buildx imagetools"
# pattern (https://docs.docker.com/build/ci/github-actions/multi-platform/)
# -- there is no manifest to merge on a build-only run, so that job is
# skipped there.
#
# To release: this workflow is triggered by the same v<version> tag
# that release-deb.yml reacts to (see that workflow's own header
# comment for the release procedure). The tag must match
# pyproject.toml's version or the build fails, exactly as in
# release-deb.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - ".github/workflows/docker.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: league-microbit/mbtools

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Determine package version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v* tag push: build this platform and push it to GHCR by digest
      # only (not by tag) -- the `push` job below merges every arch's
      # digest into the final :<version>/:latest manifest list once all
      # matrix legs have finished.
      - name: Build and push by digest
        if: startsWith(github.ref, 'refs/tags/v')
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # workflow_dispatch / PR: build this platform only, to confirm the
      # Dockerfile still builds -- no push, no manifest to merge.
      - name: Build (no push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false

  push:
    name: push manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine package version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: one
          # -t/ref arg per downloaded digest file, per docker's own
          # documented push-by-digest/imagetools-create pattern.
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect the published image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
