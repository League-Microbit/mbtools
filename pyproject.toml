[project]
name = "mbtools"
version = "0.20260924.2"
description = "Tools for finding, flashing and talking to BBC micro:bits across a fleet of hosts."
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "intelhex>=2.3.0", "pyocd>=0.44.1", "zeroconf>=0.140", "pyzmq>=27.2"]

[project.scripts]
mbregistry = "mbtools.registry.cli:main"
mbdeploy = "mbtools.deploy.cli:main"
mbserial = "mbtools.serial.cli:main"
mbrelay = "mbtools.relay.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CI (ticket 006): a hang on any one platform must surface as a named,
# per-test failure (pytest-timeout's own thread-based watchdog) rather
# than as a silent multi-hour stall that only ##[error] The operation
# was canceled reports, with no clue which test it was. 60s is generous
# for this suite's own real-hardware-free unit/fake-based tests (the
# slowest legitimate test in the suite is nowhere near that on any
# platform this project runs on); a test that legitimately needs longer
# should override with its own `@pytest.mark.timeout(...)`, not raise
# this default.
timeout = 60
