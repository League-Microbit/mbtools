[project]
name = "mbtools"
version = "0.20260923.2"
description = "Tools for finding, flashing and talking to BBC micro:bits across a fleet of hosts."
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "intelhex>=2.3.0", "pyocd>=0.44.1"]

[project.scripts]
mbregistry = "mbtools.registry.cli:main"
mbdeploy = "mbtools.deploy.cli:main"
mbserial = "mbtools.serial.cli:main"
mbrelay = "mbtools.relay:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
